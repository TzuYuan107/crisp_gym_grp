[workspace]
preview = ["pixi-build"]

channels = ["conda-forge"]
name = "crisp_gym"
platforms = ["linux-64"]

[activation]
scripts = ["scripts/set_env.sh"]
env = { LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/$PIXI_ENVIRONMENT_NAME/lib:$LD_LIBRARY_PATH" }

[dependencies]
python = "3.12.*"
compilers = "*"
cmake = ">=3.29.0.1,<4.2"
pkg-config = "*"
make = "*"
ninja = "*"
typing_inspect = ">=0.9.0,<0.10"
libstdcxx-ng = ">=13"
numpy = ">=2.0.0, <2.3"
pip = ">=24.0"
packaging = ">=24.2,<27"
setuptools = ">=71,<85"
pillow = ">=10,<14"
ffmpeg = ">8"
libgcc-ng = ">=13.2"

[target.linux.dependencies]
libgl-devel = "*"

# --- ENVIRONMENT DEFINITIONS ---
[environments]
dev = { features = ["dev"] }
jazzy = { features = ["jazzy"] }
jazzy-lerobot = { features = ["jazzy", "record", "dev"] }
jazzy-policy = { features = ["jazzy", "policy", "dev"] }
jazzy-policy-aegis = { features = ["jazzy", "policy", "dev", "aegis"] }

# --- SHARED FEATURES ---
[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"
debugpy = ">=1.8.14,<2"
pudb = ">=2025.1.3, <2026"

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]
[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
colcon-common-extensions = "*"
rosdep = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-image-transport-plugins = "*"
# cv-bridge and LeRobot share the conda OpenCV binary.
py-opencv = ">=4.9,<4.14"

# --- RECORDING ---
[feature.record.dependencies]
pynput = "*"

[feature.record.pypi-dependencies]
lerobot = { version = "==0.7.0", extras = ["dataset"] }

# --- PI0.5 AND GR00T TRAINING / DEPLOYMENT ---
[feature.policy.dependencies]
pynput = "*"

[feature.policy.pypi-dependencies]
lerobot = { version = "==0.7.0", extras = ["training", "pi", "groot"] }

# --- AEGIS SAFETY-FILTER (crisp_gym.safety, mode="point_cloud") SPECIFIC FEATURE ---
[feature.aegis.dependencies]
open3d = "*"

[feature.aegis.pypi-dependencies]
groundingdino-py = "*"
zai-sdk = "*"

[feature.aegis.tasks]
# One-time setup for safety.mode="point_cloud": groundingdino-py (above) ships the model code
# plus a bundled copy of this same config .py, but NOT the ~694MB pretrained checkpoint, which
# isn't a pypi dependency at all -- this task copies the former and downloads the latter into
# GroundingDINO/ (repo root, sibling to models/), matching vlsa_config.yaml's
# groundingdino_config_path/groundingdino_checkpoint_path. Run once per clone with
# `pixi run -e jazzy-policy-aegis download-groundingdino` from repo root.
download-groundingdino = { cmd = """
mkdir -p GroundingDINO && \
test -f GroundingDINO/GroundingDINO_SwinT_OGC.py || python -c "import groundingdino, shutil, os; shutil.copy(os.path.join(os.path.dirname(groundingdino.__file__), 'config', 'GroundingDINO_SwinT_OGC.py'), 'GroundingDINO/GroundingDINO_SwinT_OGC.py')" && \
test -f GroundingDINO/groundingdino_swint_ogc.pth || wget -O GroundingDINO/groundingdino_swint_ogc.pth https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha/groundingdino_swint_ogc.pth
""" }


# --- GLOBAL PYPI DEPS ---
[pypi-dependencies]
crisp_gym = { path = ".", editable = true }
crisp-python = { git = "https://github.com/brianchang1025/crisp_py_panda"}

[tasks]
configure = "bash scripts/configure.sh"