name: pixi CI (manual)

# Do not schedule this until the pixi integration is ready for CI.
on: workflow_dispatch

jobs:
    check-pixi:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: prefix-dev/setup-pixi@v0.8.8
                with:
                    pixi-version: v0.46.0
            - run: pixi --version
